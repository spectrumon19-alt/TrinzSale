{% if lic.status == 'active' %}
    <span class="badge badge-active"><i class="fas fa-check-circle mr-1"></i>Active</span>
{% elif lic.status == 'expiring' %}
    <span class="badge badge-expiring"><i class="fas fa-clock mr-1"></i>Expiring</span>
{% elif lic.status == 'expired' %}
    <span class="badge badge-expired"><i class="fas fa-times-circle mr-1"></i>Expired</span>
{% elif lic.status == 'revoked' %}
    <span class="badge badge-revoked"><i class="fas fa-ban mr-1"></i>Revoked</span>
{% else %}
    <span class="badge badge-revoked">{{ lic.status }}</span>
{% endif %}
