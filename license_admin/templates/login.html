<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TrintzPOS License Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
</head>
<body class="h-full bg-slate-950 flex items-center justify-center p-4">

    <!-- Background grid pattern -->
    <div class="absolute inset-0 opacity-5" style="background-image:radial-gradient(circle,#6366f1 1px,transparent 1px);background-size:32px 32px;"></div>

    <div class="relative w-full max-w-sm">

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

            <!-- Header strip -->
            <div class="px-8 pt-8 pb-6 text-center border-b border-slate-100">
                <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                    <i class="fas fa-key text-white text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-800">TrintzPOS</h1>
                <p class="text-sm text-slate-500 mt-1">License Admin Portal</p>
            </div>

            <!-- Form -->
            <form method="POST" class="px-8 py-6 space-y-4">

                {% if error %}
                <div class="flex items-center gap-2.5 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700 font-medium">
                    <i class="fas fa-exclamation-circle text-red-500"></i>
                    {{ error }}
                </div>
                {% endif %}

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="pw" autofocus required
                               class="w-full px-4 py-2.5 pr-10 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition bg-slate-50"
                               placeholder="Enter admin password">
                        <button type="button" onclick="togglePw()"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
                            <i class="fas fa-eye text-sm" id="pw-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl transition-colors duration-150 flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/20">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
        </div>

        <!-- Localhost badge -->
        <div class="text-center mt-4">
            <span class="inline-flex items-center gap-1.5 text-xs text-slate-500 bg-slate-800 px-3 py-1.5 rounded-full">
                <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
                Localhost only · 127.0.0.1:5002
            </span>
        </div>

        <p class="text-center text-xs text-slate-600 mt-3">
            © 2025 Trintz Data Labs
        </p>
    </div>

<script>
function togglePw() {
    const inp = document.getElementById('pw');
    const eye = document.getElementById('pw-eye');
    if (inp.type === 'password') {
        inp.type = 'text';
        eye.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        inp.type = 'password';
        eye.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
</body>
</html>
