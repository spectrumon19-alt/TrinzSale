<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrintzPOS - Inventory</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Custom styles for specific components - COMPACT VERSION */
        .search-results {
            position: absolute;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 0.25rem;
            max-height: 12rem;
            overflow-y: auto;
            width: 100%;
            z-index: 100;
            box-shadow: var(--surface-shadow);
            box-sizing: border-box;
            top: 100%;
            left: 0;
            margin-top: 0.25rem;
        }

        .search-result-item {
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            border-bottom: 1px solid var(--surface-border);
            transition: background-color 0.2s;
            min-height: 2rem;
        }

        .search-result-item:hover {
            background: var(--surface-alt);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text-base);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.875rem;
        }

        .search-result-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .search-result-sku {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-right: 0.5rem;
        }

        .search-result-price {
            font-weight: 700;
            color: var(--success);
            white-space: nowrap;
        }
        
        /* Overlay for Mobile Menu */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 40; 
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        
        /* Custom button styles - SMALLER VERSION */
        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 1px 3px rgba(52, 152, 219, 0.3);
            min-height: 2.25rem; /* 36px minimum touch target */
            min-width: 2.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #2980b9, #2573a7);
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(52, 152, 219, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #27ae60, #219653);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 1px 3px rgba(39, 174, 96, 0.3);
            min-height: 2.25rem; /* 36px minimum touch target */
            min-width: 2.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-success:hover {
            background: linear-gradient(135deg, #219653, #1e8449);
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(39, 174, 96, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 1px 3px rgba(149, 165, 166, 0.3);
            min-height: 2.25rem; /* 36px minimum touch target */
            min-width: 2.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-secondary:hover {
            background: linear-gradient(135deg, #7f8c8d, #6c7a7b);
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(149, 165, 166, 0.4);
        }
        
        .remove-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 0.25rem 0.5rem;
            border-radius: 0.125rem;
            cursor: pointer;
            font-size: 0.625rem;
            font-weight: 500;
            transition: all 0.2s ease;
            min-height: 2rem; /* 32px minimum touch target */
            min-width: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .remove-btn:hover {
            background-color: #c0392b;
            transform: translateY(-1px);
        }
        
        /* Icon button styles - SMALLER VERSION */
        .btn-icon {
            padding: 0.25rem;
            min-width: auto;
            min-height: auto;
            width: 2rem;
            height: 2rem;
            font-size: 0.75rem;
        }
        
        /* Custom form styles - COMPACT VERSION */
        .form-control {
            width: 100%;
            padding: 0.5rem;
            background: var(--input-bg);
            color: var(--text-base);
            border: 1px solid var(--input-border);
            border-radius: 0.25rem;
            font-size: 0.875rem;
            min-height: 2.25rem;
        }

        /* Custom table styles - COMPACT VERSION */
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            border-radius: 0.25rem;
            overflow: hidden;
        }

        th, td {
            padding: 0.5rem 0.5rem;
            text-align: left;
            border-bottom: 1px solid var(--surface-border);
            font-size: 0.875rem;
            color: var(--text-base);
        }

        th {
            background: linear-gradient(135deg, #3498db, #2c80b9);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tr:nth-child(even) {
            background: var(--surface-alt);
        }

        tr:hover {
            background: rgba(59,130,246,.06);
        }
        
        /* Admin Panel Specific Styles - COMPACT VERSION */
        .admin-panel {
            padding: 1rem;
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-base);
            margin-bottom: 0.5rem;
            text-align: left;
        }

        .admin-form {
            background: var(--surface-alt);
            border: 1px solid var(--surface-border);
            padding: 1rem;
            border-radius: 0.25rem;
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .form-group {
            margin-bottom: 0.75rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
            color: var(--text-muted);
            text-align: left;
            font-size: 0.875rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.5rem;
            background: var(--input-bg);
            color: var(--text-base);
            border: 1px solid var(--input-border);
            border-radius: 0.25rem;
            font-size: 0.875rem;
            transition: border-color 0.2s;
            text-align: left;
            min-height: 2.25rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--brand-accent-shadow);
        }

        .admin-table {
            /* overflow-x: auto; */
        }

        .admin-table table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        .admin-table th,
        .admin-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--surface-border);
            white-space: nowrap;
            font-size: 0.875rem;
            color: var(--text-base);
        }

        .admin-table th {
            background: var(--surface-alt);
            font-weight: 600;
            color: var(--text-muted);
            text-align: left;
        }

        .admin-table tr:hover {
            background: var(--surface-alt);
        }
        
        .filter-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            align-items: end;
        }
        
        .filter-bar .form-group {
            margin-bottom: 0;
            min-width: 150px;
        }
        
        .text-center {
            text-align: center;
        }
        
        /* Mobile responsive tab styles - COMPACT VERSION */
        @media (max-width: 768px) {
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-bar .form-group {
                width: 100%;
            }
            
            .filter-bar select, 
            .filter-bar input {
                width: 100%;
                min-width: auto;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .text-left {
                text-align: left;
            }
            
            .text-center {
                text-align: center;
            }
            
            .text-right {
                text-align: right;
            }
        }
        
        @media (max-width: 480px) {
            .admin-panel {
                padding: 0.5rem;
            }
            
            .section-title {
                font-size: 1.25rem;
                text-align: center;
            }
            
            .admin-form,
            .tab-content {
                padding: 0.75rem;
            }
            
            .form-group input,
            .form-group select,
            .form-group textarea {
                padding: 0.375rem;
                font-size: 0.8125rem;
            }
            
            .btn-primary,
            .btn-secondary,
            .btn-danger,
            .btn-icon {
                padding: 0.375rem 0.75rem;
                font-size: 0.8125rem;
                width: 100%;
                margin-bottom: 0.375rem;
            }
            
            .text-left {
                text-align: left;
            }
            
            .text-center {
                text-align: center;
            }
            
            .text-right {
                text-align: right;
            }
        }
        
        /* Fix for text alignment issues */
        .align-text {
            text-align: left;
            word-wrap: break-word;
            word-break: break-word;
        }
        
        .align-center {
            text-align: center;
        }
        
        .align-right {
            text-align: right;
        }
        
        /* Improved table responsiveness */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }
        
        /* Fix for long text in table cells */
        .table-cell-text {
            white-space: normal;
            word-wrap: break-word;
            max-width: 120px;
        }

        /* Pagination */
        .pagination-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.75rem 0 0.25rem;
        }

        .pagination-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .pagination-controls-inner {
            display: flex;
            gap: 0.2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .pagination-btn {
            min-width: 2rem;
            height: 2rem;
            padding: 0 0.4rem;
            border: 1px solid var(--surface-border);
            background: var(--surface);
            color: var(--text-base);
            border-radius: 0.25rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #3498db;
            color: #fff;
            border-color: #3498db;
        }

        .pagination-btn.pagination-btn-active {
            background: #3498db;
            color: #fff;
            border-color: #2980b9;
            font-weight: 700;
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination-per-page {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .pagination-per-page select {
            padding: 0.2rem 0.4rem;
            border: 1px solid var(--surface-border);
            border-radius: 0.25rem;
            background: var(--input-bg);
            color: var(--text-base);
            font-size: 0.8rem;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .pagination-wrapper {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body class="font-sans leading-normal tracking-normal">

    <script src="auth-utils.js"></script>
    <script src="component-utils.js"></script>
    <script src="sidebar-utils.js"></script>
    <script>
        // Global variables
        let currentUser = null;
        let inventoryData = [];
        let filteredInventory = [];
        let currentPage = 1;
        let itemsPerPage = 25;
        
        // Menu Toggle Functions - Now in sidebar-utils.js
        // toggleMenu() and closeMenu() are defined in sidebar-utils.js
        
        // DOM Elements
        const inventoryBody = document.getElementById('inventory-body');
        const inventorySearch = document.getElementById('inventory-search');
        const gstFilter = document.getElementById('gst-filter');
        const refreshBtn = document.getElementById('refresh-btn');
        const logoutBtn = document.getElementById('nav-logout-btn');
        const usernameSpan = document.getElementById('nav-username');
        
        // Check if user is logged in
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize sidebar pin functionality
            initializeSidebarPin();
            window.sidebarInitialized = true;
            
            // Small delay to ensure auth-utils.js is fully loaded
            setTimeout(function() {
                // Mobile Menu Toggle Logic
                const menuToggle = document.getElementById('menu-toggle');
                if (menuToggle) {
                    menuToggle.addEventListener('click', toggleMenu);
                }
                
                // Set up logout button
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', function() {
                        localStorage.removeItem('pos_token');
                        window.location.href = 'login.html';
                    });
                }
                
                // Auth check is now handled by auth-utils.js
                // Just get the current user
                currentUser = getCurrentUser();
                if (currentUser) {
                    if (usernameSpan) {
                        usernameSpan.textContent = currentUser.username;
                    }
                    
                    // Load inventory data
                    loadInventory();
                    
                    // Set up event listeners
                    setupEventListeners();
                } else {
                    window.location.href = 'login.html';
                }
            }, 10);
        });
        
        // Set up event listeners
        function setupEventListeners() {
            // Search input
            if (inventorySearch) {
                inventorySearch.addEventListener('input', filterInventory);
            }
            
            // GST filter
            if (gstFilter) {
                gstFilter.addEventListener('change', filterInventory);
            }
            
            // Refresh button
            if (refreshBtn) {
                refreshBtn.addEventListener('click', loadInventory);
            }
        }
        
        // Load inventory data
        function loadInventory() {
            const token = localStorage.getItem('pos_token');
            
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            // Show loading indicator
            showLoading();
            
            // Show loading message
            if (inventoryBody) {
                inventoryBody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-gray-500">Loading inventory data...</td></tr>';
            }
            
            fetch('/api/products', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                // Hide loading indicator
                hideLoading();
                
                inventoryData = data || [];
                displayInventory(inventoryData);
            })
            .catch(error => {
                // Hide loading indicator
                hideLoading();
                
                console.error('Error loading inventory:', error);
                if (inventoryBody) {
                    inventoryBody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-red-500">Failed to load inventory data</td></tr>';
                }
            });
        }
        
        // Display inventory data — sets filtered set and resets to page 1
        function displayInventory(products) {
            filteredInventory = products || [];
            currentPage = 1;
            renderPage();
        }

        // Render the current page from filteredInventory
        function renderPage() {
            if (!inventoryBody) return;

            const total = filteredInventory.length;

            if (total === 0) {
                inventoryBody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-gray-500">No inventory data available</td></tr>';
                updateFooter(0, 0);
                renderPagination(0);
                return;
            }

            const start = (currentPage - 1) * itemsPerPage;
            const end = Math.min(start + itemsPerPage, total);
            const pageItems = filteredInventory.slice(start, end);

            // Grand total spans all filtered items, not just current page
            let grandTotal = 0;
            filteredInventory.forEach(product => {
                grandTotal += parseFloat(product.selling_rate || 0) * parseInt(product.stock_quantity || 0);
            });

            let tableHTML = '';
            pageItems.forEach((product, idx) => {
                const rowNum = start + idx + 1;
                const productName = product.name || 'N/A';
                const sku = product.sku || 'N/A';
                const packSize = product.pack_size || '-';
                const price = parseFloat(product.selling_rate || 0);
                const stockQuantity = parseInt(product.stock_quantity || 0);
                const gstRate = parseFloat(product.gst_rate || 0);
                const subtotal = price * stockQuantity;

                let statusClass = '';
                let statusText = 'In Stock';
                if (stockQuantity === 0) {
                    statusClass = 'out-of-stock';
                    statusText = 'Out of Stock';
                } else if (stockQuantity < 10) {
                    statusClass = 'low-stock';
                    statusText = 'Low Stock';
                }

                tableHTML += `
                    <tr>
                        <td>${rowNum}</td>
                        <td>${productName}</td>
                        <td>${sku}</td>
                        <td>${packSize}</td>
                        <td>₹${price.toFixed(2)}</td>
                        <td>${stockQuantity}</td>
                        <td>${gstRate}%</td>
                        <td>₹${subtotal.toFixed(2)}</td>
                        <td class="${statusClass}">${statusText}</td>
                    </tr>
                `;
            });

            inventoryBody.innerHTML = tableHTML;
            updateFooter(grandTotal, total);
            renderPagination(total);
        }

        // Update footer with grand total across all filtered items
        function updateFooter(grandTotal, total) {
            const footer = document.getElementById('inventory-footer');
            if (footer) {
                footer.innerHTML = total > 0 ? `
                    <tr>
                        <td colspan="7" class="text-right font-bold">Grand Total (${total} items):</td>
                        <td class="font-bold">₹${grandTotal.toFixed(2)}</td>
                        <td></td>
                    </tr>
                ` : '';
            }
        }

        // Render pagination controls
        function renderPagination(total) {
            const container = document.getElementById('pagination-controls');
            if (!container) return;

            if (total === 0) {
                container.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(total / itemsPerPage);
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, total);

            // Sliding window of up to 5 page buttons
            const maxBtns = 5;
            let winStart = Math.max(1, currentPage - Math.floor(maxBtns / 2));
            let winEnd = Math.min(totalPages, winStart + maxBtns - 1);
            if (winEnd - winStart < maxBtns - 1) {
                winStart = Math.max(1, winEnd - maxBtns + 1);
            }

            let pageButtons = '';
            for (let p = winStart; p <= winEnd; p++) {
                const active = p === currentPage ? 'pagination-btn-active' : '';
                pageButtons += `<button class="pagination-btn ${active}" onclick="goToPage(${p})">${p}</button>`;
            }

            container.innerHTML = `
                <div class="pagination-wrapper">
                    <span class="pagination-info">Showing ${start}–${end} of ${total} items</span>
                    <div class="pagination-controls-inner">
                        <button class="pagination-btn" onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>«</button>
                        <button class="pagination-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>
                        ${pageButtons}
                        <button class="pagination-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>
                        <button class="pagination-btn" onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>»</button>
                    </div>
                    <div class="pagination-per-page">
                        <label>Rows per page:</label>
                        <select onchange="changeItemsPerPage(this.value)">
                            <option value="10" ${itemsPerPage === 10 ? 'selected' : ''}>10</option>
                            <option value="25" ${itemsPerPage === 25 ? 'selected' : ''}>25</option>
                            <option value="50" ${itemsPerPage === 50 ? 'selected' : ''}>50</option>
                            <option value="100" ${itemsPerPage === 100 ? 'selected' : ''}>100</option>
                        </select>
                    </div>
                </div>
            `;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredInventory.length / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderPage();
            document.querySelector('.inventory-table').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function changeItemsPerPage(value) {
            itemsPerPage = parseInt(value);
            currentPage = 1;
            renderPage();
        }
        
        // Filter inventory based on search and GST filter
        function filterInventory() {
            const searchTerm = inventorySearch ? inventorySearch.value.toLowerCase().trim() : '';
            const gstValue = gstFilter ? gstFilter.value : '';
            
            let filteredData = [...inventoryData];
            
            // Apply search filter
            if (searchTerm) {
                filteredData = filteredData.filter(product => {
                    const productName = (product.name || '').toLowerCase();
                    const sku = (product.sku || '').toLowerCase();
                    return productName.includes(searchTerm) || sku.includes(searchTerm);
                });
            }
            
            // Apply GST filter
            if (gstValue !== '') {
                filteredData = filteredData.filter(product => {
                    const gstRate = parseFloat(product.gst_rate || 0);
                    return gstRate === parseFloat(gstValue);
                });
            }
            
            displayInventory(filteredData);
        }
    </script>
    <script src="chat-widget.js?v=2"></script>
</body>
</html>
