<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Viewer - TrintzERP POS</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="assets/vendor/tailwind.js"></script>
    <link href="assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <!-- Configuration -->
    <script src="config.js"></script>
    <style>
        /* Custom styles for admin panel */
        .search-results {
            position: absolute;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 0.375rem;
            max-height: 15.625rem;
            overflow-y: auto;
            width: 100%;
            z-index: 100;
            box-shadow: var(--surface-shadow);
            box-sizing: border-box;
            top: 100%;
            left: 0;
            margin-top: 0.5rem;
        }

        .search-result-item {
            padding: 0.75rem 0.9375rem;
            cursor: pointer;
            border-bottom: 1px solid var(--surface-border);
            transition: background-color 0.2s;
            min-height: 2.75rem;
        }

        .search-result-item:hover {
            background: var(--surface-alt);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-name {
            font-weight: 600;
            margin-bottom: 0.3125rem;
            color: var(--text-base);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-result-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .search-result-sku {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-right: 0.625rem;
        }

        .search-result-price {
            font-weight: 700;
            color: var(--success);
            white-space: nowrap;
        }
        
        /* Overlay for Mobile Menu */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 40; 
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        
        /* Custom button styles */
        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(52, 152, 219, 0.3);
            min-height: 2.75rem; /* 44px minimum touch target */
            min-width: 2.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #2980b9, #2573a7);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #27ae60, #219653);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(39, 174, 96, 0.3);
            min-height: 2.75rem; /* 44px minimum touch target */
            min-width: 2.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-success:hover {
            background: linear-gradient(135deg, #219653, #1e8449);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(149, 165, 166, 0.3);
            min-height: 2.75rem; /* 44px minimum touch target */
            min-width: 2.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-secondary:hover {
            background: linear-gradient(135deg, #7f8c8d, #6c7a7b);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(149, 165, 166, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(231, 76, 60, 0.3);
            min-height: 2.75rem; /* 44px minimum touch target */
            min-width: 2.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-danger:hover {
            background: linear-gradient(135deg, #c0392b, #a5281b);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
        }
        
        /* Icon button styles */
        .btn-icon {
            padding: 0.5rem;
            min-width: auto;
            min-height: auto;
            width: 2.5rem;
            height: 2.5rem;
        }
        
        .remove-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 0.375rem 0.75rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s ease;
            min-height: 2.75rem; /* 44px minimum touch target */
            min-width: 2.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .remove-btn:hover {
            background-color: #c0392b;
            transform: translateY(-1px);
        }
        
        /* Custom form styles */
        .form-control {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid var(--input-border);
            border-radius: 0.25rem;
            font-size: 1rem;
            min-height: 2.75rem; /* 44px minimum touch target */
            background: var(--input-bg);
            color: var(--text-base);
        }

        /* Custom table styles */
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-radius: 0.5rem;
            overflow: hidden;
        }

        th, td {
            padding: 0.875rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--surface-border);
            color: var(--text-base);
        }

        th {
            background: linear-gradient(135deg, #3498db, #2c80b9);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tr:nth-child(even) {
            background-color: var(--surface-alt);
        }

        tr:hover {
            background-color: rgba(59,130,246,.06);
        }

        /* Admin Panel Specific Styles */
        .admin-panel {
            padding: 1.25rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-base);
            margin-bottom: 0.5rem;
            text-align: left;
        }

        .admin-form {
            background-color: var(--surface-alt);
            border: 1px solid var(--surface-border);
            padding: 1.5rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-muted);
            text-align: left;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--input-border);
            border-radius: 0.375rem;
            font-size: 1rem;
            transition: border-color 0.2s;
            text-align: left;
            background: var(--input-bg);
            color: var(--text-base);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2b6cb0;
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1);
        }

        .admin-table {
            /* overflow-x: auto; */
        }

        .admin-table table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        .admin-table th,
        .admin-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--surface-border);
            white-space: nowrap;
            color: var(--text-base);
        }

        .admin-table th {
            background-color: var(--surface-alt);
            font-weight: 600;
            color: var(--text-muted);
            text-align: left;
        }

        .admin-table tr:hover {
            background-color: rgba(59,130,246,.06);
        }
        
        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: end;
        }
        
        .filter-bar .form-group {
            margin-bottom: 0;
            min-width: 200px;
        }
        
        .text-center {
            text-align: center;
        }
        
        /* Mobile responsive tab styles */
        @media (max-width: 768px) {
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-bar .form-group {
                width: 100%;
            }
            
            .filter-bar select, 
            .filter-bar input {
                width: 100%;
                min-width: auto;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .text-left {
                text-align: left;
            }
            
            .text-center {
                text-align: center;
            }
            
            .text-right {
                text-align: right;
            }
        }
        
        @media (max-width: 480px) {
            .admin-panel {
                padding: 0.625rem;
            }
            
            .section-title {
                font-size: 1.5rem;
                text-align: center;
            }
            
            .admin-form,
            .tab-content {
                padding: 1rem;
            }
            
            .form-group input,
            .form-group select,
            .form-group textarea {
                padding: 0.5rem;
                font-size: 0.875rem;
            }
            
            .btn-primary,
            .btn-secondary,
            .btn-danger,
            .btn-icon {
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
                width: 100%;
                margin-bottom: 0.5rem;
            }
            
            .text-left {
                text-align: left;
            }
            
            .text-center {
                text-align: center;
            }
            
            .text-right {
                text-align: right;
            }
        }
        
        /* Fix for text alignment issues */
        .align-text {
            text-align: left;
            word-wrap: break-word;
            word-break: break-word;
        }
        
        .align-center {
            text-align: center;
        }
        
        .align-right {
            text-align: right;
        }
        
        /* Improved table responsiveness */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }
        
        /* Fix for long text in table cells */
        .table-cell-text {
            white-space: normal;
            word-wrap: break-word;
            max-width: 150px;
        }

        /* ── Send Email Modal ─────────────────────────────────────── */
        #email-modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 9000;
            display: flex; align-items: center; justify-content: center;
        }
        #email-modal {
            background: var(--surface);
            border-radius: .75rem;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            width: 100%; max-width: 420px;
            padding: 1.75rem;
            animation: em-in .18s ease;
        }
        @keyframes em-in {
            from { opacity:0; transform: scale(.95) translateY(-8px); }
            to   { opacity:1; transform: scale(1)  translateY(0);     }
        }
        #email-modal .em-icon {
            width: 44px; height: 44px; border-radius: 50%;
            background: #dbeafe;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 1rem;
        }
        #email-modal .em-icon i { color: #2563eb; font-size: 1.1rem; }
        #email-modal h3 { font-size: 1.05rem; font-weight: 700; color: var(--text-base); margin-bottom: .2rem; }
        #email-modal .em-sub { font-size: .82rem; color: var(--text-muted); margin-bottom: 1.1rem; }
        #email-modal label { display: block; font-size: .8rem; font-weight: 600; color: var(--text-muted); margin-bottom: .35rem; }
        #email-modal input[type=email] {
            width: 100%; padding: .6rem .75rem;
            border: 1px solid var(--input-border); border-radius: .4rem;
            font-size: .9rem; background: var(--input-bg); color: var(--text-base);
            box-sizing: border-box;
            transition: border-color .15s;
        }
        #email-modal input[type=email]:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
        #email-modal .em-actions { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.25rem; }
        #email-modal .btn-em-cancel {
            padding: .52rem 1rem; border-radius: .4rem; font-size: .875rem;
            font-weight: 600; cursor: pointer;
            background: var(--surface-alt); color: var(--text-base);
            border: 1px solid var(--surface-border); transition: background .15s;
        }
        #email-modal .btn-em-cancel:hover { background: var(--surface-border); }
        #email-modal .btn-em-send {
            padding: .52rem 1.2rem; border-radius: .4rem; font-size: .875rem;
            font-weight: 600; cursor: pointer;
            background: #2563eb; color: #fff; border: none;
            display: flex; align-items: center; gap: .4rem;
            transition: background .15s;
        }
        #email-modal .btn-em-send:hover { background: #1d4ed8; }
        #email-modal .btn-em-send:disabled { background: #93c5fd; cursor: not-allowed; }
    </style>
</head>
<body class="font-sans leading-normal tracking-normal">

    <!-- Send Invoice Email Modal -->
    <div id="email-modal-backdrop" style="display:none;" onclick="if(event.target===this) closeEmailModal()">
        <div id="email-modal" onclick="event.stopPropagation()">
            <div class="em-icon"><i class="fas fa-paper-plane"></i></div>
            <h3>Send Invoice by Email</h3>
            <p class="em-sub" id="em-sub">Invoice #<span id="em-invoice-no"></span></p>
            <label for="em-email-input">Customer Email Address</label>
            <input type="email" id="em-email-input" placeholder="customer@example.com" autocomplete="email">
            <div class="em-actions">
                <button class="btn-em-cancel" onclick="closeEmailModal()">Cancel</button>
                <button class="btn-em-send" id="em-send-btn" onclick="sendInvoiceEmail()">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu Overlay (Click closes menu) -->
    <div id="overlay" onclick="closeMenu()"></div>

    <div class="main-layout flex min-h-screen">
        <!-- Sidebar/Navigation -->
        <nav id="sidebar" data-testid="sidebar"

             style="width:220px;">

            <a href="dashboard.html" class="snav-brand">
                <span class="snav-brand-mark"><img src="assets/favicon.png" alt="TrintzERP"></span>

                    <span class="snav-brand-name">Tr<span class="i-dot">i</span>ntz<span class="accent">ERP</span></span>
                    <span class="snav-brand-sub">Retail &amp; Billing</span>
                </span>
            </a>

            <!-- Nav links injected here by renderSidebarLinks() -->

        </nav>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
            <div class="bg-white rounded-lg p-6 flex flex-col items-center">

                <p class="text-gray-700 font-medium">Loading...</p>

        </div>

        <!-- Main Content Area -->
        <div class="flex-1 md:ml-[220px]">
            <!-- Header uses white background on mobile to stand out against content -->

                    <button id="menu-toggle" class="md:hidden p-2 rounded-lg transition"

                            onmouseenter="this.style.background='var(--surface-alt)'"
                            onmouseleave="this.style.background='transparent'">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                    <div>
                        <p class="hd-title"><span class="brand-word">Trintz<span class="brand-erp">ERP</span></span> <span style="color:#6366f1;font-weight:300;">|</span> Invoice Viewer</p>
                        <p class="hd-sub" id="live-datetime">Loading…</p>

                </div>
                <div class="hidden md:flex items-center gap-2">
                    <span class="text-xs font-medium" style="color:var(--text-subtle);">Pin Sidebar</span>

                            </div>
                            <table>

                                        <th style="color: white !important;">Date</th>
                                        <th style="color: white !important;">Customer</th>

                                </thead>

                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="auth-utils.js"></script>
    <script src="component-utils.js"></script>
    <script>
        // Check authentication immediately when page starts loading
        if (!isAuthenticated()) {
            window.location.href = 'login.html';
        } else if (!checkPagePermission()) {
            window.location.href = 'noAccess.html';
        }

        // Menu Toggle Functions
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.style.display = 'block';
                setTimeout(() => overlay.style.opacity = 1, 10);
            } else {
                overlay.style.opacity = 0;
                setTimeout(() => overlay.style.display = 'none', 300);
                sidebar.classList.add('-translate-x-full');
            }
        }

        function closeMenu() {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                toggleMenu();
            }
        }

        // Global variables
        let currentUser = null;
        let invoices = [];
        let filteredInvoices = [];
        
        // DOM Elements
        const logoutBtn = document.getElementById('nav-logout-btn');
        const usernameSpan = document.getElementById('nav-username');
        
        // Custom Message Box Functionality
        function showMessage(message, type = 'success') {
            const messageBox = document.getElementById('messageBox');
            if (!messageBox) return console.error('Message box element not found.');
            
            messageBox.textContent = message;
            messageBox.className = 'text-white p-4 rounded-lg transition duration-300 ' + (type === 'success' ? 'bg-green-600' : type.includes('bg-') ? type : 'bg-red-600');
            messageBox.style.display = 'block';
            messageBox.style.opacity = 1;

            setTimeout(() => {
                messageBox.style.opacity = 0;
                setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 300);
            }, 4000);
        }
        
        // Search Invoices Function
        function searchInvoices() {
            const invoiceNo = document.getElementById('search-invoice-no').value.toLowerCase();
            const startDate = document.getElementById('search-start-date').value;
            const endDate = document.getElementById('search-end-date').value;
            
            // If no search criteria, show all invoices
            if (!invoiceNo && !startDate && !endDate) {
                displayInvoices(invoices);
                return;
            }
            
            // Filter invoices based on search criteria
            filteredInvoices = invoices.filter(invoice => {
                const invoiceNumber = (invoice.invoice_number || invoice.invoiceNumber || invoice.invoice_id || invoice.id || '').toString().toLowerCase();
                let invoiceDateStr = '';
                
                // Format date for comparison
                const dateCell = invoice.invoice_date || invoice.date || invoice.createdAt || '';
                if (dateCell && typeof dateCell === 'string' && dateCell.includes('T')) {
                    try {
                        invoiceDateStr = new Date(dateCell).toISOString().split('T')[0]; // YYYY-MM-DD format
                    } catch (e) {
                        invoiceDateStr = dateCell;
                    }
                } else if (dateCell) {
                    invoiceDateStr = dateCell.toString();
                }
                
                // Check if invoice matches search criteria
                const matchesInvoiceNo = invoiceNo ? invoiceNumber.includes(invoiceNo) : true;
                
                // Date range filtering
                let matchesDateRange = true;
                if (startDate || endDate) {
                    // Convert dates to comparable format
                    const invoiceDate = new Date(invoiceDateStr);
                    const start = startDate ? new Date(startDate) : null;
                    const end = endDate ? new Date(endDate) : null;
                    
                    // Check if invoice date is within range
                    if (start && end) {
                        // Both start and end dates provided
                        matchesDateRange = invoiceDate >= start && invoiceDate <= end;
                    } else if (start) {
                        // Only start date provided
                        matchesDateRange = invoiceDate >= start;
                    } else if (end) {
                        // Only end date provided
                        matchesDateRange = invoiceDate <= end;
                    }
                }
                
                return matchesInvoiceNo && matchesDateRange;
            });
            
            displayInvoices(filteredInvoices);
        }
        
        // Clear Search Function
        function clearSearch() {
            document.getElementById('search-invoice-no').value = '';
            document.getElementById('search-start-date').value = '';
            document.getElementById('search-end-date').value = '';
            displayInvoices(invoices);
        }
        
        // Invoice Viewer Functions
        function loadInvoices() {
            const token = localStorage.getItem('pos_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            // Show loading indicator
            showLoading();
            
            // Use the API base URL from configuration
            const apiBaseUrl = window.APP_CONFIG.API_BASE_URL;
            const fullUrl = apiBaseUrl + '/api/admin/invoices';
            
            console.log('Attempting to load invoices from:', fullUrl);
            
            // Fetch invoices data
            fetch(fullUrl, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                console.log('Invoices API response status:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                // Hide loading indicator
                hideLoading();
                
                invoices = data;
                displayInvoices(invoices);
            })
            .catch(error => {
                // Hide loading indicator
                hideLoading();
                
                console.error('Error loading invoices:', error);
                console.error('API Base URL used:', apiBaseUrl);
                console.error('Full URL attempted:', fullUrl);
                
                // Check if this might be a CORS issue
                if (error instanceof TypeError && error.message.includes('fetch')) {
                    showMessage('Network error: Unable to connect to API server. Please check if the server is running and accessible.', 'error');
                } else {
                    showMessage('Failed to load invoices: ' + error.message, 'error');
                }
                
                // Display error in table as well
                const tbody = document.getElementById('invoices-body');
                if (tbody) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="8" class="text-center text-red-500 p-4">
                                <div class="font-bold">Error loading invoices</div>
                                <div class="text-sm mt-2">${error.message}</div>
                                <div class="text-xs mt-2">Please check your network connection and API server</div>
                                <button class="btn-primary mt-4" onclick="loadInvoices()">Retry</button>
                            </td>
                        </tr>`;
                }
            });
        }
        
        function displayInvoices(invoicesData) {
            const tbody = document.getElementById('invoices-body');
            if (!tbody) return;
            
            // Apply status filters
            const showCompleted = document.getElementById('show-completed-chk');
            const showCancelled = document.getElementById('show-cancelled-chk');
            const showComp = showCompleted ? showCompleted.checked : true;
            const showCanc = showCancelled ? showCancelled.checked : false;
            
            let filtered = [];
            if (Array.isArray(invoicesData)) {
                filtered = invoicesData.filter(inv => {
                    const status = (inv.status || '').toLowerCase();
                    if (status === 'cancelled') return showCanc;
                    return showComp; // Completed or any other status
                });
            }
            
            if (!filtered || filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center p-4">
                            <div class="text-gray-500 mb-2">No invoices found</div>
                            <div class="text-sm text-gray-400">Adjust filters or create new invoices</div>
                        </td>
                    </tr>
                `;
                return;
            }

            // Check if we have valid data
            if (!Array.isArray(filtered)) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center p-4 text-red-500">
                            <div class="font-bold">Data Format Error</div>
                            <div class="text-sm mt-2">Expected array but received: ${typeof filtered}</div>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = '';
            filtered.forEach((invoice, index) => {
                const row = document.createElement('tr');
                
                // Check if invoice object exists and has the required properties
                if (!invoice || typeof invoice !== 'object') {
                    row.innerHTML = `
                        <td colspan="8" class="text-center p-2 text-red-500">
                            Invalid invoice data at index ${index}
                        </td>
                    `;
                    tbody.appendChild(row);
                    return;
                }
                
                // Try different possible field names
                const invoiceNumberCell = invoice.invoice_number || invoice.invoiceNumber || invoice.invoice_id || invoice.id || 'N/A';
                const dateCell = invoice.invoice_date || invoice.date || invoice.createdAt || 'N/A';
                const customerCell = invoice.customer_name || invoice.customerName || invoice.customer || '-';
                // Grand total = taxable value (total_amount) + GST
                const exGst   = parseFloat(invoice.total_amount || invoice.totalAmount || invoice.amount || 0);
                const gstAmt  = parseFloat(invoice.total_gst   || invoice.totalGst    || 0);
                const totalAmountCell = exGst + gstAmt;
                const statusCell = invoice.status || invoice.invoiceStatus || 'N/A';
                const isCancelled = statusCell.toLowerCase() === 'cancelled';

                // Format date if it's a timestamp
                let formattedDate = dateCell;
                if (dateCell && typeof dateCell === 'string' && dateCell.includes('T')) {
                    try {
                        formattedDate = new Date(dateCell).toLocaleDateString();
                    } catch (e) {
                        formattedDate = dateCell;
                    }
                }

                // Format amount as currency
                const formattedAmount = '₹' + totalAmountCell.toFixed(2);
                
                // Ensure we're accessing the correct field names
                const invoiceId = invoice.invoice_id || invoice.id || invoice.invoiceId || index;
                
                const statusBadge = isCancelled 
                    ? '<span class="bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded-full font-medium">Cancelled</span>' 
                    : '<span class="bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded-full font-medium">Completed</span>';
                
                row.className = isCancelled ? 'bg-red-50' : '';
                row.innerHTML = `
                    <td><input type="checkbox" class="invoice-select-chk rounded border-gray-300" data-id="${invoiceId}"></td>
                    <td class="text-gray-700${isCancelled ? ' text-gray-400' : ''}">${index + 1}</td>
                    <td class="font-semibold ${isCancelled ? 'text-gray-400 line-through' : 'text-blue-700'}">${invoiceNumberCell}</td>
                    <td class="text-gray-700${isCancelled ? ' text-gray-400' : ''}">${formattedDate}</td>
                    <td class="text-gray-700${isCancelled ? ' text-gray-400' : ''}">${customerCell}</td>
                    <td class="font-semibold ${isCancelled ? 'text-gray-400' : 'text-green-700'}">${formattedAmount}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <button class="btn-secondary btn-icon" onclick="viewInvoice(${invoiceId})" title="View">
                            <i class="fas fa-eye"></i>
                        </button>
                        ${!isCancelled ? `<button class="btn-icon" onclick="openEmailModal(${invoiceId},'${invoiceNumberCell.replace(/'/g,"\\'")}','${customerCell.replace(/'/g,"\\'")}',this)" title="Send Email" style="background:#dbeafe;color:#2563eb;border:none;cursor:pointer;border-radius:.35rem;width:2.5rem;height:2.5rem;display:inline-flex;align-items:center;justify-content:center;transition:background .15s;" onmouseenter="this.style.background='#bfdbfe'" onmouseleave="this.style.background='#dbeafe'"><i class="fas fa-envelope"></i></button>` : ''}
                        <button class="btn-danger btn-icon" onclick="deleteInvoice(${invoiceId})" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            
            // Reset select-all checkbox
            const selectAllChk = document.getElementById('select-all-chk');
            if (selectAllChk) selectAllChk.checked = false;
            updateBulkDeleteBtn();
        }
        
        function viewInvoice(invoiceId) {
            const token = localStorage.getItem('pos_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            // Use the API base URL from configuration
            const apiBaseUrl = window.APP_CONFIG.API_BASE_URL;
            
            // Use the correct endpoint for viewing invoices
            fetch(apiBaseUrl + `/api/sales/${invoiceId}`, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                // Store the response status for error handling
                const status = response.status;
                
                // Check if response is OK
                if (response.ok) {
                    return response.json().then(data => ({status: status, body: data, ok: true}));
                } else {
                    // Try to parse error response as JSON
                    return response.clone().json()
                        .then(data => ({status: status, body: data, ok: false}))
                        .catch(() => {
                            // If JSON parsing fails, it might be an HTML error page
                            return response.clone().text().then(text => ({status: status, body: text, ok: false}));
                        });
                }
            })
            .then(result => {
                if (result.ok) {
                    // Success case - open invoice in new window/tab
                    const invoiceData = result.body;
                    
                    // Store invoice data in localStorage
                    localStorage.setItem('invoiceData', JSON.stringify(invoiceData));
                    
                    // Open invoice.html in a new window/tab
                    window.open('invoice.html', '_blank');
                } else {
                    // Error case
                    if (typeof result.body === 'string') {
                        // HTML error response
                        throw new Error('Server error ' + result.status + ': ' + result.body.substring(0, 200));
                    } else {
                        // JSON error response
                        throw new Error(result.body.message || 'Failed to load invoice with status: ' + result.status);
                    }
                }
            })
            .catch(error => {
                console.error('Error fetching invoice details:', error);
                showMessage(error.message || 'Failed to load invoice details', 'error');
            });
        }
        
        function deleteInvoice(invoiceId) {
            if (!confirm('Are you sure you want to delete this invoice? This action cannot be undone.')) {
                return;
            }
            
            const token = localStorage.getItem('pos_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            // Show loading indicator
            showLoading();
            
            // Use the API base URL from configuration
            const apiBaseUrl = window.APP_CONFIG.API_BASE_URL;
            
            // Use the cancel endpoint instead of delete since DELETE is not working
            fetch(apiBaseUrl + `/api/sales/${invoiceId}/cancel`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                // Store the response status for error handling
                const status = response.status;
                
                // Check if response is OK
                if (response.ok) {
                    return response.json().then(data => ({status: status, body: data, ok: true}));
                } else {
                    // Try to parse error response as JSON
                    return response.clone().json()
                        .then(data => ({status: status, body: data, ok: false}))
                        .catch(() => {
                            // If JSON parsing fails, it might be an HTML error page
                            return response.clone().text().then(text => ({status: status, body: text, ok: false}));
                        });
                }
            })
            .then(result => {
                // Hide loading indicator
                hideLoading();
                
                if (result.ok) {
                    // Success case
                    showMessage('Invoice cancelled successfully! Quantities added back to inventory.', 'success');
                    loadInvoices();
                } else {
                    // Error case
                    if (typeof result.body === 'string') {
                        // HTML error response
                        throw new Error('Server error ' + result.status + ': ' + result.body.substring(0, 200));
                    } else {
                        // JSON error response
                        throw new Error(result.body.message || 'Failed to cancel invoice with status: ' + result.status);
                    }
                }
            })
            .catch(error => {
                // Hide loading indicator
                hideLoading();
                
                console.error('Error cancelling invoice:', error);
                showMessage(error.message || 'Failed to cancel invoice', 'error');
            });
        }
        
        // Navigation component script
        document.addEventListener('DOMContentLoaded', function() {
            // Mobile Menu Toggle Logic
            const menuToggle = document.getElementById('menu-toggle');
            if (menuToggle) {
                menuToggle.addEventListener('click', toggleMenu);
            }
            
            // Set up logout button
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    localStorage.removeItem('pos_token');
                    window.location.href = 'login.html';
                });
            }
            
            // Update username display
            const user = getCurrentUser();
            if (user) {
                if (usernameSpan) {
                    usernameSpan.textContent = user.username;
                }
                
                // Store current user
                currentUser = user;
            }
            
            // Set up search functionality
            const searchBtn = document.getElementById('search-invoice-btn');
            if (searchBtn) {
                searchBtn.addEventListener('click', searchInvoices);
            }
            
            const clearSearchBtn = document.getElementById('clear-search-btn');
            if (clearSearchBtn) {
                clearSearchBtn.addEventListener('click', clearSearch);
            }
            
            // Add event listeners for Enter key in search inputs
            const invoiceNoInput = document.getElementById('search-invoice-no');
            const startDateInput = document.getElementById('search-start-date');
            const endDateInput = document.getElementById('search-end-date');
            
            if (invoiceNoInput) {
                invoiceNoInput.addEventListener('keyup', function(event) {
                    if (event.key === 'Enter') {
                        searchInvoices();
                    }
                });
            }
            
            if (startDateInput) {
                startDateInput.addEventListener('change', searchInvoices);
            }
            
            if (endDateInput) {
                endDateInput.addEventListener('change', searchInvoices);
            }
            
            // Status filter checkboxes
            const showCompletedChk = document.getElementById('show-completed-chk');
            const showCancelledChk = document.getElementById('show-cancelled-chk');
            if (showCompletedChk) showCompletedChk.addEventListener('change', () => displayInvoices(invoices));
            if (showCancelledChk) showCancelledChk.addEventListener('change', () => displayInvoices(invoices));
            
            // Select-all checkbox
            const selectAllChk = document.getElementById('select-all-chk');
            if (selectAllChk) {
                selectAllChk.addEventListener('change', function() {
                    const checkboxes = document.querySelectorAll('.invoice-select-chk');
                    checkboxes.forEach(chk => chk.checked = this.checked);
                    updateBulkDeleteBtn();
                });
            }
            
            // Bulk delete button
            const bulkDeleteBtn = document.getElementById('bulk-delete-btn');
            if (bulkDeleteBtn) {
                bulkDeleteBtn.addEventListener('click', bulkDeleteInvoices);
            }
            
            // Delegated event listener for individual checkboxes
            const invoicesBody = document.getElementById('invoices-body');
            if (invoicesBody) {
                invoicesBody.addEventListener('change', function(e) {
                    if (e.target.classList.contains('invoice-select-chk')) {
                        updateBulkDeleteBtn();
                        // Update select-all state
                        const allChks = document.querySelectorAll('.invoice-select-chk');
                        const checkedChks = document.querySelectorAll('.invoice-select-chk:checked');
                        const selectAll = document.getElementById('select-all-chk');
                        if (selectAll) selectAll.checked = allChks.length > 0 && allChks.length === checkedChks.length;
                    }
                });
            }
            
            // Load initial data
            loadInvoices();
        });
        
        function updateBulkDeleteBtn() {
            const checkedChks = document.querySelectorAll('.invoice-select-chk:checked');
            const bulkDeleteBtn = document.getElementById('bulk-delete-btn');
            if (bulkDeleteBtn) {
                if (checkedChks.length > 0) {
                    bulkDeleteBtn.style.display = 'inline-block';
                    bulkDeleteBtn.textContent = `Delete Selected (${checkedChks.length})`;
                } else {
                    bulkDeleteBtn.style.display = 'none';
                }
            }
        }
        
        function bulkDeleteInvoices() {
            const checkedChks = document.querySelectorAll('.invoice-select-chk:checked');
            if (checkedChks.length === 0) return;
            
            if (!confirm(`Are you sure you want to cancel ${checkedChks.length} selected invoice(s)? Stock will be restored for each cancelled invoice.`)) {
                return;
            }
            
            const token = localStorage.getItem('pos_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            const apiBaseUrl = window.APP_CONFIG.API_BASE_URL;
            showLoading();
            
            const deletePromises = Array.from(checkedChks).map(chk => {
                const invoiceId = chk.getAttribute('data-id');
                return fetch(apiBaseUrl + `/api/sales/${invoiceId}/cancel`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                }).then(response => {
                    if (!response.ok) throw new Error(`Failed to cancel invoice ${invoiceId}`);
                    return response.json();
                });
            });
            
            Promise.all(deletePromises)
            .then(results => {
                hideLoading();
                showMessage(`${results.length} invoice(s) cancelled successfully! Stock restored.`, 'success');
                loadInvoices();
            })
            .catch(error => {
                hideLoading();
                console.error('Error bulk cancelling invoices:', error);
                showMessage('Some invoices could not be cancelled: ' + error.message, 'error');
                loadInvoices();
            });
        }
        
        // ── Email modal ───────────────────────────────────────────────────────
        let _emailInvoiceId = null;

        function openEmailModal(invoiceId, invoiceNumber, customerName) {
            _emailInvoiceId = invoiceId;
            document.getElementById('em-sub').innerHTML =
                `Invoice <strong>#${invoiceNumber}</strong>${customerName && customerName !== '-' ? ` &mdash; ${customerName}` : ''}`;
            document.getElementById('em-email-input').value = '';
            document.getElementById('em-send-btn').disabled = false;
            document.getElementById('em-send-btn').innerHTML = '<i class="fas fa-paper-plane"></i> Send';
            document.getElementById('email-modal-backdrop').style.display = 'flex';
            setTimeout(() => document.getElementById('em-email-input').focus(), 80);
        }

        function closeEmailModal() {
            document.getElementById('email-modal-backdrop').style.display = 'none';
            _emailInvoiceId = null;
        }

        function sendInvoiceEmail() {
            const email = document.getElementById('em-email-input').value.trim();
            if (!email || !email.includes('@')) {
                document.getElementById('em-email-input').focus();
                showMessage('Please enter a valid email address.', 'error');
                return;
            }

            const token = localStorage.getItem('pos_token');
            if (!token) { window.location.href = 'login.html'; return; }

            const btn = document.getElementById('em-send-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending…';

            const apiBase = window.APP_CONFIG.API_BASE_URL;
            fetch(`${apiBase}/api/sales/${_emailInvoiceId}/send-email`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email })
            })
            .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
            .then(({ ok, data }) => {
                closeEmailModal();
                if (ok && data.success) {
                    showMessage(data.message || `Invoice sent to ${email}`, 'success');
                } else {
                    showMessage(data.error || 'Failed to send email.', 'error');
                }
            })
            .catch(() => {
                closeEmailModal();
                showMessage('Network error. Please try again.', 'error');
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
            });
        }

        document.addEventListener('keydown', function(e) {
            const backdrop = document.getElementById('email-modal-backdrop');
            if (!backdrop || backdrop.style.display !== 'flex') return;
            if (e.key === 'Escape') closeEmailModal();
            if (e.key === 'Enter')  sendInvoiceEmail();
        });

        // Add loading overlay functions if they don't exist
        if (typeof showLoading !== 'function') {
            function showLoading() {
                const loadingOverlay = document.getElementById('loading-overlay');
                if (loadingOverlay) {
                    loadingOverlay.classList.remove('hidden');
                }
            }
        }
        
        if (typeof hideLoading !== 'function') {
            function hideLoading() {
                const loadingOverlay = document.getElementById('loading-overlay');
                if (loadingOverlay) {
                    loadingOverlay.classList.add('hidden');
                }
            }
        }
    </script>
