[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --html=tests/reports/test_report.html
    --self-contained-html
    --cov=routes
    --cov=auth
    --cov=db
    --cov-report=html:tests/reports/coverage
    --cov-report=term-missing
    --cov-fail-under=70

markers =
    auth: Authentication and authorization tests
    products: Product CRUD and search tests
    sales: Sales invoice creation, cancellation, GST calculation
    inventory: Inventory management tests
    purchase: Purchase order tests
    suppliers: Supplier management tests
    credit: Credit customer tests
    admin: Admin panel (user/permission management)
    reports: Reporting endpoint tests
    db: Database integrity (FK, UNIQUE, CHECK, CASCADE, rollback)
    security: Security tests (injection, JWT, BOLA, brute-force)
    performance: SLA / throughput tests
    ui: Playwright UI automation (requires running Flask server)
    slow: Slow tests — deselect with -m "not slow"
    regression: End-to-end regression workflows

log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Show 10 slowest tests
# Uncomment if pytest-durations is installed:
# addopts = ... --durations=10
