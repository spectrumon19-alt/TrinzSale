<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Page Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            color: #fff;
            font-family: sans-serif;
        }
        #app-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            opacity: 1;
            z-index: 9999;
            transition: opacity 0.3s;
        }
        #app-splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #162032;
            border-radius: 8px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; }
        .form-group {
            margin: 20px 0;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #1a2840;
            border: 1px solid #253650;
            color: #fff;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #2563eb; }
    </style>
    <div id="app-splash"></div>
    <script>
        function hideSplash() {
            const splash = document.getElementById('app-splash');
            if (splash) splash.classList.add('hidden');
        }
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', hideSplash, { once: true });
        } else {
            hideSplash();
        }
        setTimeout(hideSplash, 200);
    </script>
</head>
<body>
    <div class="container">
        <h1>✓ License Page Working</h1>
        <p>If you see this, the page is loading correctly.</p>
        
        <div class="form-group">
            <label>License Key:</label>
            <input type="text" placeholder="Enter your license key here">
        </div>
        
        <button onclick="alert('License activation would be processed here')">
            Activate License
        </button>
    </div>
</body>
</html>
