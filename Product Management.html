<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - TrintzERP POS</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="assets/vendor/tailwind.js"></script>
    <link href="assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <!-- Configuration -->
    <script src="config.js"></script>
    <style>
        /* Custom styles for admin panel - COMPACT VERSION */
        .search-results {
            position: absolute;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 0.25rem;
            max-height: 12rem;
            overflow-y: auto;
            width: 100%;
            z-index: 100;
            box-shadow: var(--surface-shadow);
            box-sizing: border-box;
            top: 100%;
            left: 0;
            margin-top: 0.25rem;
        }

        .search-result-item {
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            border-bottom: 1px solid var(--surface-border);
            transition: background-color 0.2s;
            min-height: 2rem;
        }

        .search-result-item:hover {
            background: var(--surface-alt);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text-base);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.875rem;
        }

        .search-result-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .search-result-sku {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-right: 0.5rem;
        }
        
        .search-result-price {
            font-weight: 700;
            color: #27ae60;
            white-space: nowrap;
        }
        
        /* Overlay for Mobile Menu */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 40; 
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        
        /* Custom button styles - SMALLER VERSION */
        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 1px 3px rgba(52, 152, 219, 0.3);
            min-height: 2.25rem; /* 36px minimum touch target */
            min-width: 2.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #2980b9, #2573a7);
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(52, 152, 219, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #27ae60, #219653);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 1px 3px rgba(39, 174, 96, 0.3);
            min-height: 2.25rem; /* 36px minimum touch target */
            min-width: 2.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-success:hover {
            background: linear-gradient(135deg, #219653, #1e8449);
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(39, 174, 96, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 1px 3px rgba(149, 165, 166, 0.3);
            min-height: 2.25rem; /* 36px minimum touch target */
            min-width: 2.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-secondary:hover {
            background: linear-gradient(135deg, #7f8c8d, #6c7a7b);
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(149, 165, 166, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 1px 3px rgba(231, 76, 60, 0.3);
            min-height: 2.25rem; /* 36px minimum touch target */
            min-width: 2.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-danger:hover {
            background: linear-gradient(135deg, #c0392b, #a5281b);
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(231, 76, 60, 0.4);
        }
        
        /* Icon button styles - SMALLER VERSION */
        .btn-icon {
            padding: 0.25rem;
            min-width: auto;
            min-height: auto;
            width: 2rem;
            height: 2rem;
            font-size: 0.75rem;
        }
        
        .remove-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 0.25rem 0.5rem;
            border-radius: 0.125rem;
            cursor: pointer;
            font-size: 0.625rem;
            font-weight: 500;
            transition: all 0.2s ease;
            min-height: 2rem; /* 32px minimum touch target */
            min-width: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .remove-btn:hover {
            background-color: #c0392b;
            transform: translateY(-1px);
        }
        
        /* Custom form styles - COMPACT VERSION */
        .form-control {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--input-border);
            border-radius: 0.25rem;
            font-size: 0.875rem;
            min-height: 2.25rem; /* 36px minimum touch target */
            background: var(--input-bg);
            color: var(--text-base);
        }

        /* Custom table styles - COMPACT VERSION */
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            border-radius: 0.25rem;
            overflow: hidden;
        }

        th, td {
            padding: 0.5rem 0.5rem;
            text-align: left;
            border-bottom: 1px solid var(--surface-border);
            font-size: 0.875rem;
            color: var(--text-base);
        }

        th {
            background: linear-gradient(135deg, #3498db, #2c80b9);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tr:nth-child(even) {
            background-color: var(--surface-alt);
        }

        tr:hover {
            background-color: rgba(59,130,246,.06);
        }

        /* Admin Panel Specific Styles - COMPACT VERSION */
        .admin-panel {
            padding: 1rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-base);
            margin-bottom: 0.5rem;
            text-align: left;
        }

        .admin-form {
            background-color: var(--surface-alt);
            border: 1px solid var(--surface-border);
            padding: 1rem;
            border-radius: 0.25rem;
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .form-group {
            margin-bottom: 0.75rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
            color: var(--text-muted);
            text-align: left;
            font-size: 0.875rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--input-border);
            border-radius: 0.25rem;
            font-size: 0.875rem;
            transition: border-color 0.2s;
            text-align: left;
            min-height: 2.25rem;
            background: var(--input-bg);
            color: var(--text-base);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2b6cb0;
            box-shadow: 0 0 0 2px rgba(43, 108, 176, 0.1);
        }

        .admin-table {
            /* overflow-x: auto; */
        }

        .admin-table table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        .admin-table th,
        .admin-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--surface-border);
            white-space: nowrap;
            font-size: 0.875rem;
            color: var(--text-base);
        }

        .admin-table th {
            background-color: var(--surface-alt);
            font-weight: 600;
            color: var(--text-muted);
            text-align: left;
        }

        .admin-table tr:hover {
            background-color: rgba(59,130,246,.06);
        }
        
        .filter-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            align-items: end;
        }
        
        .filter-bar .form-group {
            margin-bottom: 0;
            min-width: 150px;
        }
        
        .text-center {
            text-align: center;
        }
        
        /* Mobile responsive tab styles - COMPACT VERSION */
        @media (max-width: 768px) {
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-bar .form-group {
                width: 100%;
            }
            
            .filter-bar select, 
            .filter-bar input {
                width: 100%;
                min-width: auto;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .text-left {
                text-align: left;
            }
            
            .text-center {
                text-align: center;
            }
            
            .text-right {
                text-align: right;
            }
        }
        
        @media (max-width: 480px) {
            .admin-panel {
                padding: 0.5rem;
            }
            
            .section-title {
                font-size: 1.25rem;
                text-align: center;
            }
            
            .admin-form,
            .tab-content {
                padding: 0.75rem;
            }
            
            .form-group input,
            .form-group select,
            .form-group textarea {
                padding: 0.375rem;
                font-size: 0.8125rem;
            }
            
            .btn-primary,
            .btn-secondary,
            .btn-danger,
            .btn-icon {
                padding: 0.375rem 0.75rem;
                font-size: 0.8125rem;
                width: 100%;
                margin-bottom: 0.375rem;
            }
            
            .text-left {
                text-align: left;
            }
            
            .text-center {
                text-align: center;
            }
            
            .text-right {
                text-align: right;
            }
        }
        
        /* Fix for text alignment issues */
        .align-text {
            text-align: left;
            word-wrap: break-word;
            word-break: break-word;
        }
        
        .align-center {
            text-align: center;
        }
        
        .align-right {
            text-align: right;
        }
        
        /* Improved table responsiveness */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }
        
        /* Fix for long text in table cells */
        .table-cell-text {
            white-space: normal;
            word-wrap: break-word;
            max-width: 120px;
        }

        /* Pagination */
        .pagination-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.75rem 0 0.25rem;
        }

        .pagination-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .pagination-controls-inner {
            display: flex;
            gap: 0.2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .pagination-btn {
            min-width: 2rem;
            height: 2rem;
            padding: 0 0.4rem;
            border: 1px solid var(--surface-border);
            background: var(--surface);
            color: var(--text-base);
            border-radius: 0.25rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #3498db;
            color: #fff;
            border-color: #3498db;
        }

        .pagination-btn.pagination-btn-active {
            background: #3498db;
            color: #fff;
            border-color: #2980b9;
            font-weight: 700;
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination-per-page {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .pagination-per-page select {
            padding: 0.2rem 0.4rem;
            border: 1px solid var(--surface-border);
            border-radius: 0.25rem;
            background: var(--input-bg);
            color: var(--text-base);
            font-size: 0.8rem;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .pagination-wrapper {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body class="font-sans leading-normal tracking-normal">

                <span class="snav-brand-text">
                    <span class="snav-brand-name">Tr<span class="i-dot">i</span>ntz<span class="accent">ERP</span></span>
                    <span class="snav-brand-sub">Retail &amp; Billing</span>
                </span>
            </a>

                        </svg>

                                    <div class="form-group">
                                        <label for="product-sku">SKU *</label>

                                    <div class="form-group">

                                        <th>Selling Rate</th>

                                </tbody>
                            </table>
                            <div id="pm-pagination-controls"></div>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="component-utils.js"></script>
    <script>
        // Check authentication immediately when page starts loading
        if (!isAuthenticated()) {
            window.location.href = 'login.html';
        } else if (!checkPagePermission()) {
            window.location.href = 'noAccess.html';
        }

        // Menu Toggle Functions
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.style.display = 'block';
                setTimeout(() => overlay.style.opacity = 1, 10);
            } else {
                overlay.style.opacity = 0;
                setTimeout(() => overlay.style.display = 'none', 300);
                sidebar.classList.add('-translate-x-full');
            }
        }

        function closeMenu() {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                toggleMenu();
            }
        }

        // Global variables
        let currentUser = null;
        let products = [];
        let pmRows = [];
        let pmPage = 1;
        let pmPerPage = 25;
        
        // DOM Elements
        const logoutBtn = document.getElementById('nav-logout-btn');
        const usernameSpan = document.getElementById('nav-username');
        
        // Custom Message Box Functionality
        function showMessage(message, type = 'success') {
            const messageBox = document.getElementById('messageBox');
            if (!messageBox) return console.error('Message box element not found.');
            
            messageBox.textContent = message;
            messageBox.className = 'text-white p-4 rounded-lg transition duration-300 ' + (type === 'success' ? 'bg-green-600' : type.includes('bg-') ? type : 'bg-red-600');
            messageBox.style.display = 'block';
            messageBox.style.opacity = 1;

            setTimeout(() => {
                messageBox.style.opacity = 0;
                setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 300);
            }, 4000);
        }
        
        // ============ Bulk Import / Export ============

        async function exportProducts() {
            const token = localStorage.getItem('pos_token');
            if (!token) return (window.location.href = 'login.html');
            try {
                showMessage('Exporting...', 'info');
                const res = await fetch(apiBaseUrl + '/api/products/export', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Server error ' + res.status);
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'products_export.xlsx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showMessage('Export downloaded successfully.', 'success');
            } catch (e) {
                showMessage('Export failed: ' + e.message, 'error');
            }
        }

        async function importProducts(input) {
            const file = input.files[0];
            if (!file) return;
            input.value = '';

            const token = localStorage.getItem('pos_token');
            if (!token) return (window.location.href = 'login.html');

            const resultsDiv = document.getElementById('import-results');
            resultsDiv.style.display = 'none';
            showMessage('Importing "' + file.name + '" — please wait...', 'info');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(apiBaseUrl + '/api/products/import', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Import failed');

                const hasErrors = data.errors && data.errors.length > 0;
                const color = hasErrors ? '#fefce8' : '#f0fdf4';
                const border = hasErrors ? '#fde047' : '#86efac';
                let html = `<div style="background:${color};border:1px solid ${border};padding:0.75rem 1rem;border-radius:6px;font-size:0.87rem;">
                    <strong>${data.message}</strong>`;
                if (hasErrors) {
                    html += `<details style="margin-top:0.5rem;"><summary style="cursor:pointer;">${data.errors.length} row error(s) — click to expand</summary>
                        <ul style="margin-top:0.4rem;padding-left:1.2rem;">`;
                    data.errors.forEach(e => { html += `<li>Row ${e.row}: ${e.message}</li>`; });
                    html += '</ul></details>';
                }
                html += '</div>';
                resultsDiv.innerHTML = html;
                resultsDiv.style.display = 'block';
                showMessage(data.message, hasErrors ? 'info' : 'success');
                loadProducts();
            } catch (e) {
                showMessage('Import failed: ' + e.message, 'error');
            }
        }

        function downloadImportTemplate() {
            const headers = 'name,sku,pack_size,gst_rate,purchase_rate,selling_rate,barcode,stock_quantity';
            const example = 'Example Product,PROD001,1kg,5,90,100,8901234567890,50';
            const csv = headers + '\n' + example + '\n';
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'products_import_template.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Product Management Functions
        function loadProducts() {
            const token = localStorage.getItem('pos_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            // Show loading indicator
            showLoading();
            
            const tbody = document.getElementById('products-body');
            if (tbody) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center">Loading products...</td></tr>';
            }
            
            // Use the API base URL from configuration
            const apiBaseUrl = window.APP_CONFIG.API_BASE_URL;
            const fullUrl = apiBaseUrl + '/api/products';
            
            fetch(fullUrl, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                // Hide loading indicator
                hideLoading();
                
                products = data;
                displayProducts(products);
            })
            .catch(error => {
                // Hide loading indicator
                hideLoading();
                
                console.error('Error loading products:', error);
                showMessage('Failed to load products: ' + error.message, 'error');
                
                // Display error in table
                if (tbody) {
                    tbody.innerHTML = `<tr><td colspan="9" class="text-center text-red-500">Error loading products: ${error.message}</td></tr>`;
                }
            });
        }
        
        function addProduct() {
            const token = localStorage.getItem('pos_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            const productName = document.getElementById('product-name').value;
            const productSku = document.getElementById('product-sku').value;
            const productPack = document.getElementById('product-pack').value;
            const productGst = document.getElementById('product-gst').value;
            const productPurchase = document.getElementById('product-purchase').value;
            const productSelling = document.getElementById('product-selling').value;
            const productStock = document.getElementById('product-stock').value;
            
            if (!productName || !productSku || !productGst || !productSelling) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }
            
            const productData = {
                name: productName,
                sku: productSku,
                pack_size: productPack,
                gst_rate: parseFloat(productGst),
                purchase_rate: parseFloat(productPurchase) || 0,
                selling_rate: parseFloat(productSelling),
                stock_quantity: parseInt(productStock) || 0
            };
            
            // Show loading indicator
            showLoading();
            
            // Use the API base URL from configuration
            const apiBaseUrl = window.APP_CONFIG.API_BASE_URL;
            
            fetch(apiBaseUrl + '/api/products', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(productData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Failed to add product');
                }
            })
            .then(data => {
                // Hide loading indicator
                hideLoading();
                
                showMessage('Product added successfully!', 'success');
                document.getElementById('product-form').reset();
                loadProducts();
            })
            .catch(error => {
                // Hide loading indicator
                hideLoading();
                
                console.error('Error adding product:', error);
                showMessage('Failed to add product', 'error');
            });
        }
        
        function saveProduct(productId) {
            const token = localStorage.getItem('pos_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const productName = document.getElementById('product-name').value;
            const productSku = document.getElementById('product-sku').value;
            const productPack = document.getElementById('product-pack').value;
            const productGst = document.getElementById('product-gst').value;
            const productPurchase = document.getElementById('product-purchase').value;
            const productSelling = document.getElementById('product-selling').value;
            const productStock = document.getElementById('product-stock').value;
            const productBarcode = (document.getElementById('product-barcode') || {}).value || '';

            if (!productName || !productSku || !productGst || !productSelling) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }

            const productData = {
                name: productName,
                sku: productSku,
                pack_size: productPack,
                gst_rate: parseFloat(productGst),
                purchase_rate: parseFloat(productPurchase) || 0,
                selling_rate: parseFloat(productSelling),
                stock_quantity: parseInt(productStock) || 0,
                barcode: productBarcode || null
            };
            
            // Show loading indicator
            showLoading();
            
            // Use the API base URL from configuration
            const apiBaseUrl = window.APP_CONFIG.API_BASE_URL;
            
            fetch(apiBaseUrl + `/api/products/${productId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(productData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Failed to update product');
                }
            })
            .then(data => {
                // Hide loading indicator
                hideLoading();
                
                showMessage('Product updated successfully!', 'success');
                cancelEditProduct();
                loadProducts();
            })
            .catch(error => {
                // Hide loading indicator
                hideLoading();
                
                console.error('Error updating product:', error);
                showMessage('Failed to update product', 'error');
            });
        }
        
        function cancelEditProduct() {
            document.getElementById('product-form').reset();
            document.getElementById('add-product-btn').style.display = 'inline-block';
            document.getElementById('save-product-btn').style.display = 'none';
            document.getElementById('cancel-edit-btn').style.display = 'none';
            document.getElementById('save-product-btn').onclick = null;
        }
        
        function editProduct(productId) {
            const product = products.find(p => p.product_id === productId);
            if (!product) {
                showMessage('Product not found', 'error');
                return;
            }
            
            // Fill the form with product data, ensuring proper data types
            document.getElementById('product-name').value = product.name || '';
            document.getElementById('product-sku').value = product.sku || '';
            document.getElementById('product-pack').value = product.pack_size || '';
            const bcField = document.getElementById('product-barcode');
            if (bcField) bcField.value = product.barcode || '';
            
            // Convert gst_rate to number for the form
            if (product.gst_rate !== null && product.gst_rate !== undefined) {
                const gstRate = parseFloat(product.gst_rate);
                document.getElementById('product-gst').value = !isNaN(gstRate) ? gstRate : '';
            } else {
                document.getElementById('product-gst').value = '';
            }
            
            // Convert purchase_rate to number for the form
            if (product.purchase_rate !== null && product.purchase_rate !== undefined) {
                const purchaseRate = parseFloat(product.purchase_rate);
                document.getElementById('product-purchase').value = !isNaN(purchaseRate) ? purchaseRate : '';
            } else {
                document.getElementById('product-purchase').value = '';
            }
            
            // Convert selling_rate to number for the form
            if (product.selling_rate !== null && product.selling_rate !== undefined) {
                const sellingRate = parseFloat(product.selling_rate);
                document.getElementById('product-selling').value = !isNaN(sellingRate) ? sellingRate : '';
            } else {
                document.getElementById('product-selling').value = '';
            }
            
            // Convert stock_quantity to integer for the form
            if (product.stock_quantity !== null && product.stock_quantity !== undefined) {
                const stockQuantity = parseInt(product.stock_quantity);
                document.getElementById('product-stock').value = !isNaN(stockQuantity) ? stockQuantity : '';
            } else {
                document.getElementById('product-stock').value = '';
            }
            
            // Show save button and hide add button
            document.getElementById('add-product-btn').style.display = 'none';
            document.getElementById('save-product-btn').style.display = 'inline-block';
            document.getElementById('cancel-edit-btn').style.display = 'inline-block';
            
            // Set up save button to save this specific product
            document.getElementById('save-product-btn').onclick = function() {
                saveProduct(productId);
            };
        }
        
        function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) {
                return;
            }
            
            const token = localStorage.getItem('pos_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            // Show loading indicator
            showLoading();
            
            // Use the API base URL from configuration
            const apiBaseUrl = window.APP_CONFIG.API_BASE_URL;
            
            fetch(apiBaseUrl + `/api/products/${productId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (response.ok) {
                    // Hide loading indicator
                    hideLoading();
                    
                    showMessage('Product deleted successfully!', 'success');
                    loadProducts();
                } else {
                    throw new Error('Failed to delete product');
                }
            })
            .catch(error => {
                // Hide loading indicator
                hideLoading();
                
                console.error('Error deleting product:', error);
                showMessage('Failed to delete product', 'error');
            });
        }
        
        function displayProducts(data) {
            pmRows = data || [];
            pmPage = 1;
            renderProductsPage();
        }

        function renderProductsPage() {
            const tbody = document.getElementById('products-body');
            if (!tbody) return;

            const total = pmRows.length;

            if (total === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center">No products found</td></tr>';
                renderProductsPagination(0);
                return;
            }

            const start = (pmPage - 1) * pmPerPage;
            const end = Math.min(start + pmPerPage, total);
            const pageItems = pmRows.slice(start, end);

            tbody.innerHTML = '';
            pageItems.forEach((product, idx) => {
                const rowNum = start + idx + 1;
                const productName = product.name || '-';
                const productSku = product.sku || '-';
                const productPack = product.pack_size || '-';

                let productGst = '0.00';
                if (product.gst_rate != null) {
                    const v = parseFloat(product.gst_rate);
                    if (!isNaN(v)) productGst = v.toFixed(2);
                }

                let productPurchase = '0.00';
                if (product.purchase_rate != null) {
                    const v = parseFloat(product.purchase_rate);
                    if (!isNaN(v)) productPurchase = v.toFixed(2);
                }

                let productSelling = '0.00';
                if (product.selling_rate != null) {
                    const v = parseFloat(product.selling_rate);
                    if (!isNaN(v)) productSelling = v.toFixed(2);
                }

                let productStock = '0';
                if (product.stock_quantity != null) {
                    productStock = parseInt(product.stock_quantity) || '0';
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="align-center">${rowNum}</td>
                    <td class="align-text">${productName}</td>
                    <td class="align-text">${productSku}</td>
                    <td class="align-text">${productPack}</td>
                    <td class="align-right">${productGst}%</td>
                    <td class="align-right">₹${productPurchase}</td>
                    <td class="align-right">₹${productSelling}</td>
                    <td class="align-right">${productStock}</td>
                    <td class="align-center">
                        <button class="btn-secondary btn-icon" onclick="editProduct(${product.product_id})" title="Edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-danger btn-icon" onclick="deleteProduct(${product.product_id})" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            renderProductsPagination(total);
        }

        function renderProductsPagination(total) {
            const container = document.getElementById('pm-pagination-controls');
            if (!container) return;

            if (total === 0) { container.innerHTML = ''; return; }

            const totalPages = Math.ceil(total / pmPerPage);
            const start = (pmPage - 1) * pmPerPage + 1;
            const end = Math.min(pmPage * pmPerPage, total);

            const maxBtns = 5;
            let winStart = Math.max(1, pmPage - Math.floor(maxBtns / 2));
            let winEnd = Math.min(totalPages, winStart + maxBtns - 1);
            if (winEnd - winStart < maxBtns - 1) winStart = Math.max(1, winEnd - maxBtns + 1);

            let pageButtons = '';
            for (let p = winStart; p <= winEnd; p++) {
                const active = p === pmPage ? 'pagination-btn-active' : '';
                pageButtons += `<button class="pagination-btn ${active}" onclick="pmGoToPage(${p})">${p}</button>`;
            }

            container.innerHTML = `
                <div class="pagination-wrapper">
                    <span class="pagination-info">Showing ${start}–${end} of ${total} items</span>
                    <div class="pagination-controls-inner">
                        <button class="pagination-btn" onclick="pmGoToPage(1)" ${pmPage === 1 ? 'disabled' : ''}>«</button>
                        <button class="pagination-btn" onclick="pmGoToPage(${pmPage - 1})" ${pmPage === 1 ? 'disabled' : ''}>‹</button>
                        ${pageButtons}
                        <button class="pagination-btn" onclick="pmGoToPage(${pmPage + 1})" ${pmPage === totalPages ? 'disabled' : ''}>›</button>
                        <button class="pagination-btn" onclick="pmGoToPage(${totalPages})" ${pmPage === totalPages ? 'disabled' : ''}>»</button>
                    </div>
                    <div class="pagination-per-page">
                        <label>Rows per page:</label>
                        <select onchange="pmChangePerPage(this.value)">
                            <option value="10" ${pmPerPage === 10 ? 'selected' : ''}>10</option>
                            <option value="25" ${pmPerPage === 25 ? 'selected' : ''}>25</option>
                            <option value="50" ${pmPerPage === 50 ? 'selected' : ''}>50</option>
                            <option value="100" ${pmPerPage === 100 ? 'selected' : ''}>100</option>
                        </select>
                    </div>
                </div>
            `;
        }

        function pmGoToPage(page) {
            const totalPages = Math.ceil(pmRows.length / pmPerPage);
            if (page < 1 || page > totalPages) return;
            pmPage = page;
            renderProductsPage();
            document.querySelector('.admin-table').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function pmChangePerPage(value) {
            pmPerPage = parseInt(value);
            pmPage = 1;
            renderProductsPage();
        }
        
        function searchProducts() {
            const searchTerm = document.getElementById('product-search').value.toLowerCase();
            
            if (!searchTerm) {
                displayProducts(products);
                return;
            }
            
            const filteredProducts = products.filter(product => {
                // Ensure proper handling of potentially null values
                const name = (product.name || '').toLowerCase();
                const sku = (product.sku || '').toLowerCase();
                return name.includes(searchTerm) || sku.includes(searchTerm);
            });
            
            displayProducts(filteredProducts);
        }
        
        // Navigation component script
        document.addEventListener('DOMContentLoaded', function() {
            // Mobile Menu Toggle Logic
            const menuToggle = document.getElementById('menu-toggle');
            if (menuToggle) {
                menuToggle.addEventListener('click', toggleMenu);
            }
            
            // Set up logout button
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    localStorage.removeItem('pos_token');
                    window.location.href = 'login.html';
                });
            }
            
            // Update username display
            const user = getCurrentUser();
            if (user) {
                if (usernameSpan) {
                    usernameSpan.textContent = user.username;
                }
                
                // Store current user
                currentUser = user;
            }
            
            // Set up event listeners for forms and buttons
            // Product Management
            const addProductBtn = document.getElementById('add-product-btn');
            if (addProductBtn) {
                addProductBtn.addEventListener('click', addProduct);
            }
            
            const saveProductBtn = document.getElementById('save-product-btn');
            if (saveProductBtn) {
                // Event listener will be set when editing
            }
            
            const cancelEditBtn = document.getElementById('cancel-edit-btn');
            if (cancelEditBtn) {
                cancelEditBtn.addEventListener('click', cancelEditProduct);
            }
            
            const productSearchInput = document.getElementById('product-search');
            if (productSearchInput) {
                productSearchInput.addEventListener('input', searchProducts);
            }
            
            // Load initial data
            loadProducts();
        });
        
        // Add loading overlay functions if they don't exist
        if (typeof showLoading !== 'function') {
            function showLoading() {
                const loadingOverlay = document.getElementById('loading-overlay');
                if (loadingOverlay) {
                    loadingOverlay.classList.remove('hidden');
                }
            }
        }
        
        if (typeof hideLoading !== 'function') {
            function hideLoading() {
                const loadingOverlay = document.getElementById('loading-overlay');
                if (loadingOverlay) {
                    loadingOverlay.classList.add('hidden');
                }
            }
        }
    </script>
