<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Configuration</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        /* configureDB — uses CSS variables from styles.css, inherits dark mode */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: var(--page-bg);
            color: var(--text-base);
            line-height: 1.6;
            padding: 1.25rem;
        }

        /* ── Section blocks ── */
        .db-section {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--surface-shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--surface-border);
        }

        .section-title {
            font-size: 0.9375rem;
            font-weight: 700;
            color: var(--text-base);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-title i { color: var(--brand-accent); }

        /* ── Status badge ── */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-connected    { background: rgba(16,185,129,.12); color: var(--success); border: 1px solid rgba(16,185,129,.25); }
        .status-disconnected { background: rgba(239,68,68,.1);   color: var(--danger);  border: 1px solid rgba(239,68,68,.2); }
        .status-badge i { font-size: 0.6rem; }

        /* ── Form grid ── */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.35rem; }

        .form-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: var(--input-bg);
            color: var(--text-base);
            border: 1px solid var(--input-border);
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-family: var(--font);
            min-height: 2.375rem;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--brand-accent-shadow);
        }
        .form-control[readonly] {
            background: var(--surface-alt);
            color: var(--text-muted);
            cursor: default;
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 0.4rem; padding: 0.5rem 1rem;
            border-radius: var(--radius); font-weight: 600; font-size: 0.875rem;
            cursor: pointer; border: none; font-family: var(--font);
            transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
            min-height: 2.375rem;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .btn-primary  { background: var(--brand-accent); color: #fff; }
        .btn-primary:not(:disabled):hover  { background: var(--brand-accent-hover); transform: translateY(-1px); box-shadow: 0 4px 10px var(--brand-accent-shadow); }

        .btn-success  { background: var(--success); color: #fff; }
        .btn-success:not(:disabled):hover  { background: var(--success-hover); transform: translateY(-1px); }

        .btn-warning  { background: var(--warning); color: #fff; }
        .btn-warning:not(:disabled):hover  { background: var(--warning-hover); transform: translateY(-1px); }

        .btn-outline  {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--surface-border);
        }
        .btn-outline:not(:disabled):hover {
            background: var(--surface-alt);
            color: var(--text-base);
            border-color: var(--input-border);
        }

        /* ── Actions row ── */
        .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.25rem; }

        /* ── Alert messages ── */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }
        .alert-success { background: rgba(16,185,129,.1);  color: var(--success); border: 1px solid rgba(16,185,129,.25); }
        .alert-danger  { background: rgba(239,68,68,.1);   color: var(--danger);  border: 1px solid rgba(239,68,68,.25); }
        .alert-warning { background: rgba(245,158,11,.1);  color: var(--warning); border: 1px solid rgba(245,158,11,.25); }
        .alert-info    { background: rgba(59,130,246,.08); color: var(--brand-accent); border: 1px solid rgba(59,130,246,.2); }

        .hidden { display: none; }

        @media (max-width: 600px) {
            body { padding: 0.75rem; }
            .form-grid { grid-template-columns: 1fr; }
            .actions { flex-direction: column; }
            .actions .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Current Connection -->
    <div class="db-section">
        <div class="section-header">
            <h2 class="section-title"><i class="fas fa-database"></i> Database Configuration</h2>
            <span id="connectionStatus" class="status-badge status-disconnected">
                <i class="fas fa-circle"></i> Disconnected
            </span>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Host</label>
                <input type="text" id="currentHost" class="form-control" value="" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">Database Name</label>
                <input type="text" id="currentDatabase" class="form-control" value="" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="currentUsername" class="form-control" value="" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">Port</label>
                <input type="text" id="currentPort" class="form-control" value="" readonly>
            </div>
        </div>
    </div>

    <!-- New Connection -->
    <div class="db-section">
        <div class="section-header">
            <h3 class="section-title"><i class="fas fa-plug"></i> New Database Connection</h3>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Host *</label>
                <input type="text" id="newHost" class="form-control" placeholder="e.g., localhost or cloud-db.example.com">
            </div>
            <div class="form-group">
                <label class="form-label">Database Name *</label>
                <input type="text" id="newDatabase" class="form-control" placeholder="e.g., pos_db">
            </div>
            <div class="form-group">
                <label class="form-label">Username *</label>
                <input type="text" id="newUsername" class="form-control" placeholder="e.g., postgres">
            </div>
            <div class="form-group">
                <label class="form-label">Password *</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Enter password">
            </div>
            <div class="form-group">
                <label class="form-label">Port</label>
                <input type="text" id="newPort" class="form-control" placeholder="e.g., 5432" value="5432">
            </div>
        </div>
        <div class="actions">
            <button id="testConnectionBtn" class="btn btn-outline">
                <i class="fas fa-plug"></i> Test Connection
            </button>
            <button id="saveConnectionBtn" class="btn btn-primary" disabled>
                <i class="fas fa-save"></i> Save Configuration
            </button>
            <button id="downloadSchemaBtn" class="btn btn-warning">
                <i class="fas fa-download"></i> Download Schema SQL
            </button>
        </div>
    </div>

    <div id="messageContainer"></div>

    <!-- Initialize DB -->
    <div class="db-section">
        <div class="section-header">
            <h3 class="section-title"><i class="fas fa-server"></i> Initialize New Database</h3>
        </div>
        <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:1rem;">Run this to set up the required tables and initial data in your new database.</p>
        <div class="actions">
            <button id="initializeDbBtn" class="btn btn-success" disabled>
                <i class="fas fa-database"></i> Initialize Database
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const currentHost = document.getElementById('currentHost');
        const currentDatabase = document.getElementById('currentDatabase');
        const currentUsername = document.getElementById('currentUsername');
        const currentPort = document.getElementById('currentPort');
        
        const newHost = document.getElementById('newHost');
        const newDatabase = document.getElementById('newDatabase');
        const newUsername = document.getElementById('newUsername');
        const newPassword = document.getElementById('newPassword');
        const newPort = document.getElementById('newPort');
        
        const testConnectionBtn = document.getElementById('testConnectionBtn');
        const saveConnectionBtn = document.getElementById('saveConnectionBtn');
        const downloadSchemaBtn = document.getElementById('downloadSchemaBtn');
        const initializeDbBtn = document.getElementById('initializeDbBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const messageContainer = document.getElementById('messageContainer');
        
        // Load current database connection details
        function loadCurrentDatabaseDetails() {
            // Make API call to get current database configuration
            fetch('/api/admin/service/db-config', {
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('pos_token')}`
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.config) {
                    currentHost.value = data.config.host || '';
                    currentDatabase.value = data.config.database || '';
                    currentUsername.value = data.config.username || '';
                    currentPort.value = data.config.port || '';
                } else {
                    // Use default values if API call fails
                    currentHost.value = 'pg-23a6e8b0-spectrumon19-21fe.j.aivencloud.com';
                    currentDatabase.value = 'defaultdb';
                    currentUsername.value = 'avnadmin';
                    currentPort.value = '13430';
                }
            })
            .catch(error => {
                console.error('Error loading current database details:', error);
                // Use default values if API call fails
                currentHost.value = 'pg-23a6e8b0-spectrumon19-21fe.j.aivencloud.com';
                currentDatabase.value = 'defaultdb';
                currentUsername.value = 'avnadmin';
                currentPort.value = '13430';
            });
        }
        
        // Show message function
        function showMessage(message, type = 'info') {
            const alertClass = type === 'success' ? 'alert-success' : 
                              type === 'error' ? 'alert-danger' : 
                              type === 'warning' ? 'alert-warning' : '';
            
            messageContainer.innerHTML = `
                <div class="alert ${alertClass}">
                    ${message}
                </div>
            `;
            
            // Auto hide after 5 seconds for success messages
            if (type === 'success') {
                setTimeout(() => {
                    messageContainer.innerHTML = '';
                }, 5000);
            }
        }
        
        // Update connection status
        function updateConnectionStatus(connected) {
            if (connected) {
                connectionStatus.className = 'status-badge status-connected';
                connectionStatus.innerHTML = '<i class="fas fa-circle"></i> Connected';
            } else {
                connectionStatus.className = 'status-badge status-disconnected';
                connectionStatus.innerHTML = '<i class="fas fa-circle"></i> Disconnected';
            }
        }
        
        // Test connection function
        async function testConnection() {
            const host = newHost.value.trim();
            const database = newDatabase.value.trim();
            const username = newUsername.value.trim();
            const password = newPassword.value;
            const port = newPort.value.trim();
            
            if (!host || !database || !username || !password) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }
            
            try {
                showMessage('Testing connection...', 'info');
                
                // Make API call to test the connection
                const response = await fetch('/api/admin/service/db-test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('pos_token')}`
                    },
                    body: JSON.stringify({
                        host: host,
                        database: database,
                        username: username,
                        password: password,
                        port: port
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('Connection successful!', 'success');
                    saveConnectionBtn.disabled = false;
                    initializeDbBtn.disabled = false;
                    updateConnectionStatus(true);
                } else {
                    showMessage('Connection failed: ' + data.message, 'error');
                    saveConnectionBtn.disabled = true;
                    initializeDbBtn.disabled = true;
                    updateConnectionStatus(false);
                }
            } catch (error) {
                showMessage('Connection failed: ' + error.message, 'error');
                saveConnectionBtn.disabled = true;
                initializeDbBtn.disabled = true;
                updateConnectionStatus(false);
            }
        }
        
        // Save connection function
        function saveConnection() {
            const host = newHost.value.trim();
            const database = newDatabase.value.trim();
            const username = newUsername.value.trim();
            const password = newPassword.value;
            const port = newPort.value.trim();
            
            if (!host || !database || !username || !password) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }
            
            // Make API call to save the connection
            fetch('/api/admin/service/db-config', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('pos_token')}`
                },
                body: JSON.stringify({
                    host: host,
                    database: database,
                    username: username,
                    password: password,
                    port: port
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('Database configuration saved successfully!', 'success');
                    
                    // Update current connection display
                    currentHost.value = host;
                    currentDatabase.value = database;
                    currentUsername.value = username;
                    currentPort.value = port;
                } else {
                    showMessage('Error saving configuration: ' + data.message, 'error');
                }
            })
            .catch(error => {
                showMessage('Error saving configuration: ' + error.message, 'error');
            });
        }
        
        // Initialize database function
        function initializeDatabase() {
            showMessage('Initializing database... This may take a few moments.', 'info');
            
            // Make API call to initialize the database
            fetch('/api/admin/service/run-schema', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('pos_token')}`
                },
                body: JSON.stringify({
                    // In a real implementation, you might pass initialization parameters here
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('Database initialized successfully with all required tables and initial data!', 'success');
                } else {
                    showMessage('Error initializing database: ' + data.message, 'error');
                }
            })
            .catch(error => {
                showMessage('Error initializing database: ' + error.message, 'error');
            });
        }
        
        // Download schema SQL
        function downloadSchema() {
            // In a real implementation, this would download the actual schema.sql file from the server
            fetch('/schema.sql')
                .then(response => response.text())
                .then(schemaContent => {
                    const blob = new Blob([schemaContent], { type: 'application/sql' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'pos_schema.sql';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    showMessage('Schema SQL file downloaded successfully!', 'success');
                })
                .catch(error => {
                    console.error('Error downloading schema:', error);
                    // Fallback to the embedded schema content
                    const schemaContent = `-- PostgreSQL Database Schema for POS System

-- Users table
CREATE TABLE IF NOT EXISTS users (
    user_id SERIAL PRIMARY KEY,
    username VARCHAR UNIQUE NOT NULL,
    password_hash VARCHAR NOT NULL,
    role VARCHAR NOT NULL CHECK (role IN ('Admin', 'Cashier')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- Products table
CREATE TABLE IF NOT EXISTS products (
    product_id SERIAL PRIMARY KEY,
    name VARCHAR NOT NULL,
    pack_size VARCHAR,
    sku VARCHAR UNIQUE,
    gst_rate DECIMAL(5, 2) NOT NULL,
    purchase_rate DECIMAL(10, 2),
    selling_rate DECIMAL(10, 2) NOT NULL,
    status VARCHAR DEFAULT 'Active' CHECK (status IN ('Active', 'Inactive'))
);

-- Inventory table
CREATE TABLE IF NOT EXISTS inventory (
    product_id INTEGER PRIMARY KEY REFERENCES products(product_id),
    stock_quantity INTEGER NOT NULL DEFAULT 0
);

-- Suppliers table (for purchase orders)
CREATE TABLE IF NOT EXISTS suppliers (
    supplier_id SERIAL PRIMARY KEY,
    supplier_name VARCHAR NOT NULL,
    supplier_gst_number VARCHAR UNIQUE,
    contact_person VARCHAR,
    email VARCHAR,
    address TEXT,
    mobile VARCHAR,
    bank_name VARCHAR,
    bank_account_number VARCHAR,
    ifsc_code VARCHAR,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- Purchase orders table
CREATE TABLE IF NOT EXISTS purchase_orders (
    purchase_order_id SERIAL PRIMARY KEY,
    supplier_id INTEGER REFERENCES suppliers(supplier_id),
    supplier_name VARCHAR, -- For backward compatibility
    supplier_gst_number VARCHAR, -- For backward compatibility
    purchase_order_number VARCHAR UNIQUE NOT NULL,
    purchase_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    user_id INTEGER REFERENCES users(user_id),
    total_amount DECIMAL(10, 2) NOT NULL,
    status VARCHAR DEFAULT 'Completed' CHECK (status IN ('Completed', 'Cancelled')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- Add a comment to clarify the uniqueness constraint
COMMENT ON COLUMN purchase_orders.purchase_order_number IS 'Unique purchase order number - each PO number must be unique across all purchase orders';

-- Purchase order items table
CREATE TABLE IF NOT EXISTS purchase_order_items (
    item_id SERIAL PRIMARY KEY,
    purchase_order_id INTEGER REFERENCES purchase_orders(purchase_order_id) ON DELETE CASCADE,
    product_id INTEGER REFERENCES products(product_id),
    quantity INTEGER NOT NULL,
    purchase_rate DECIMAL(10, 2) NOT NULL,
    gst_rate DECIMAL(5, 2) DEFAULT 0.00,
    taxable_value DECIMAL(10, 2) DEFAULT 0.00,
    sgst DECIMAL(10, 2) DEFAULT 0.00,
    cgst DECIMAL(10, 2) DEFAULT 0.00,
    total_amount DECIMAL(10, 2) NOT NULL,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- Add a comment to clarify the relationship
COMMENT ON TABLE purchase_order_items IS 'Items for purchase orders - each purchase order can have multiple items';

-- Add columns to existing purchase_order_items table if they don't exist
-- This is for upgrading existing databases
ALTER TABLE purchase_order_items ADD COLUMN IF NOT EXISTS gst_rate DECIMAL(5, 2) DEFAULT 0.00;
ALTER TABLE purchase_order_items ADD COLUMN IF NOT EXISTS taxable_value DECIMAL(10, 2) DEFAULT 0.00;
ALTER TABLE purchase_order_items ADD COLUMN IF NOT EXISTS sgst DECIMAL(10, 2) DEFAULT 0.00;
ALTER TABLE purchase_order_items ADD COLUMN IF NOT EXISTS cgst DECIMAL(10, 2) DEFAULT 0.00;
ALTER TABLE purchase_order_items ADD COLUMN IF NOT EXISTS created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP;

-- Add foreign key constraint with cascade delete if it doesn't exist
DO $$ 
BEGIN
    IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints 
        WHERE constraint_name = 'purchase_order_items_purchase_order_id_fkey'
    ) THEN
        ALTER TABLE purchase_order_items 
        ADD CONSTRAINT purchase_order_items_purchase_order_id_fkey 
        FOREIGN KEY (purchase_order_id) REFERENCES purchase_orders(purchase_order_id) ON DELETE CASCADE;
    END IF;
END $$;

-- Sales invoices table
CREATE TABLE IF NOT EXISTS sales_invoices (
    invoice_id SERIAL PRIMARY KEY,
    invoice_number VARCHAR UNIQUE NOT NULL,
    receipt_number VARCHAR UNIQUE,
    invoice_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    customer_name VARCHAR,
    customer_contact VARCHAR,
    user_id INTEGER REFERENCES users(user_id),
    mode_of_payment VARCHAR,
    upi_transaction_id VARCHAR,
    customer_mobile VARCHAR,
    total_amount DECIMAL(10, 2) NOT NULL,
    total_gst DECIMAL(10, 2) NOT NULL,
    discount_percentage DECIMAL(5, 2) DEFAULT 0.00,
    discount_amount DECIMAL(10, 2) DEFAULT 0.00,
    status VARCHAR DEFAULT 'Completed' CHECK (status IN ('Completed', 'Cancelled'))
);

-- Sales invoice items table
CREATE TABLE IF NOT EXISTS sales_invoice_items (
    item_id SERIAL PRIMARY KEY,
    invoice_id INTEGER REFERENCES sales_invoices(invoice_id),
    product_id INTEGER REFERENCES products(product_id),
    quantity INTEGER NOT NULL,
    rate_at_sale DECIMAL(10, 2) NOT NULL,
    gst_rate_at_sale DECIMAL(5, 2) NOT NULL,
    exclusive_gst_amount DECIMAL(10, 2) NOT NULL,
    sgst DECIMAL(10, 2) NOT NULL,
    cgst DECIMAL(10, 2) NOT NULL,
    total_line_amount DECIMAL(10, 2) NOT NULL,
    discount_percentage DECIMAL(5, 2) DEFAULT 0.00
);

-- Add indexes for better query performance
CREATE INDEX IF NOT EXISTS idx_purchase_orders_date ON purchase_orders(purchase_date DESC, created_at DESC);
CREATE INDEX IF NOT EXISTS idx_purchase_orders_number ON purchase_orders(purchase_order_number);
CREATE INDEX IF NOT EXISTS idx_suppliers_name ON suppliers(supplier_name);
CREATE INDEX IF NOT EXISTS idx_purchase_order_items_po_id ON purchase_order_items(purchase_order_id);
CREATE INDEX IF NOT EXISTS idx_products_name ON products(name);

-- Credit customers table
CREATE TABLE IF NOT EXISTS credit_customers (
    customer_id SERIAL PRIMARY KEY,
    customer_code VARCHAR UNIQUE NOT NULL,
    customer_uuid VARCHAR UNIQUE NOT NULL,
    name VARCHAR NOT NULL,
    mobile VARCHAR NOT NULL,
    email VARCHAR,
    address TEXT,
    invoice_no VARCHAR,
    current_balance DECIMAL(10, 2) DEFAULT 0.00,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- Credit transactions table
CREATE TABLE IF NOT EXISTS credit_transactions (
    transaction_id SERIAL PRIMARY KEY,
    customer_id INTEGER REFERENCES credit_customers(customer_id) ON DELETE CASCADE,
    transaction_type VARCHAR NOT NULL CHECK (transaction_type IN ('credit', 'debit')),
    amount DECIMAL(10, 2) NOT NULL,
    invoice_no VARCHAR,
    note TEXT,
    previous_balance DECIMAL(10, 2) NOT NULL,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- Add customer_code column if it doesn't exist
ALTER TABLE credit_customers ADD COLUMN IF NOT EXISTS customer_code VARCHAR UNIQUE;

-- Add indexes for better query performance
CREATE INDEX IF NOT EXISTS idx_credit_customers_mobile ON credit_customers(mobile);
CREATE INDEX IF NOT EXISTS idx_credit_customers_name ON credit_customers(name);
CREATE INDEX IF NOT EXISTS idx_credit_customers_code ON credit_customers(customer_code);
CREATE INDEX IF NOT EXISTS idx_credit_transactions_customer_id ON credit_transactions(customer_id);
CREATE INDEX IF NOT EXISTS idx_credit_transactions_date ON credit_transactions(created_at);

-- Function to update updated_at timestamp
CREATE OR REPLACE FUNCTION update_updated_at_column()
RETURNS TRIGGER AS $$
BEGIN
    NEW.updated_at = CURRENT_TIMESTAMP;
    RETURN NEW;
END;
$$ language 'plpgsql';

-- Trigger to automatically update updated_at on credit_customers table
DROP TRIGGER IF EXISTS update_credit_customers_updated_at ON credit_customers;
CREATE TRIGGER update_credit_customers_updated_at 
    BEFORE UPDATE ON credit_customers 
    FOR EACH ROW 
    EXECUTE FUNCTION update_updated_at_column();
