<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - TrintzERP POS</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-container {
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
            padding: 2rem;
        }

        .error-logo {
            height: 90px;
            width: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto 1.5rem;
        }
        
        .error-code {
            font-size: 5rem;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 1rem;
        }
        
        .error-message {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        
        .error-description {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 2rem;
        }
        
        .btn-home {
            display: inline-block;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 1rem 2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(52, 152, 219, 0.3);
        }
        
        .btn-home:hover {
            background: linear-gradient(135deg, #2980b9, #2573a7);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-container">
            <img src="assets/logo.png" alt="Trintz Data Labs" class="error-logo">
            <div class="error-code">404</div>
            <div class="error-message">Page Not Found</div>
            <div class="error-description">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</div>
            <a href="login.html" class="btn-home">Go to Login Page</a>
        </div>
    </div>

    <!-- Footer Container -->
            <div id="footer-container"></div>
    <script src="auth-utils.js"></script>
    <script src="component-utils.js"></script>
</body>
</html>
